# Generated from the sysown/proxysql v3.0 caller CI-3p-sqlalchemy.yml.
# The job logic lives in sysown/proxysql/.github/workflows/ci-3p-sqlalchemy.yml@GH-Actions.
name: CI-3p-sqlalchemy
run-name: '${{ github.workflow }} ${{ inputs.branch }} ${{ inputs.sha }}'

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'sysown/proxysql commit to test (its CI-builds handoff artifact must still exist, retention 1 day)'
        required: true
        type: string
      branch:
        description: 'sysown/proxysql branch of the commit'
        default: 'v3.0'
        type: string
      build_run_id:
        description: 'sysown/proxysql CI-builds run id (the producer of the tested build)'
        default: ''
        type: string
      build_attempt:
        description: 'attempt of that CI-builds run (its ci-manifest identifies the build)'
        default: '1'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.sha }}
  cancel-in-progress: false

# reusable workflows run with the caller's token permissions: read the repository, manage the run's
# artifacts (ci-3p-sqlalchemy removes its per-leg summary artifacts), report checks
permissions:
  contents: read
  actions: write
  checks: write   # the tier-context test jobs report their result as check runs of this repository

jobs:
  run-mysql:
    uses: sysown/proxysql/.github/workflows/ci-3p-sqlalchemy.yml@GH-Actions
    # 'secrets: inherit' does not cross organizations: pass the secrets the reusable workflow declares
    secrets:
      PROXYSQL_3P_TESTING_DEPLOY_KEY: ${{ secrets.PROXYSQL_3P_TESTING_DEPLOY_KEY }}
      PROXYSQL_ARTIFACTS_TOKEN: ${{ secrets.PROXYSQL_ARTIFACTS_TOKEN }}
    with:
      infradb: ${{ vars.MATRIX_3P_SQLALCHEMY_INFRADB_MYSQL }}
      connector: ${{ vars.MATRIX_3P_SQLALCHEMY_CONNECTOR_MYSQL }}
      proxysql_repo: 'sysown/proxysql'
      sha: ${{ inputs.sha }}
      branch: ${{ inputs.branch }}
      build_run_id: ${{ inputs.build_run_id }}
      producer_attempt: ${{ inputs.build_attempt }}
      consumer_id: run-mysql   # the catalogue instance (row) of this job

  run-mariadb:
    uses: sysown/proxysql/.github/workflows/ci-3p-sqlalchemy.yml@GH-Actions
    # 'secrets: inherit' does not cross organizations: pass the secrets the reusable workflow declares
    secrets:
      PROXYSQL_3P_TESTING_DEPLOY_KEY: ${{ secrets.PROXYSQL_3P_TESTING_DEPLOY_KEY }}
      PROXYSQL_ARTIFACTS_TOKEN: ${{ secrets.PROXYSQL_ARTIFACTS_TOKEN }}
    with:
      infradb: ${{ vars.MATRIX_3P_SQLALCHEMY_INFRADB_MARIADB }}
      connector: ${{ vars.MATRIX_3P_SQLALCHEMY_CONNECTOR_MARIADB }}
      proxysql_repo: 'sysown/proxysql'
      sha: ${{ inputs.sha }}
      branch: ${{ inputs.branch }}
      build_run_id: ${{ inputs.build_run_id }}
      producer_attempt: ${{ inputs.build_attempt }}
      consumer_id: run-mariadb   # the catalogue instance (row) of this job

  run-pgsql:
    uses: sysown/proxysql/.github/workflows/ci-3p-sqlalchemy.yml@GH-Actions
    # 'secrets: inherit' does not cross organizations: pass the secrets the reusable workflow declares
    secrets:
      PROXYSQL_3P_TESTING_DEPLOY_KEY: ${{ secrets.PROXYSQL_3P_TESTING_DEPLOY_KEY }}
      PROXYSQL_ARTIFACTS_TOKEN: ${{ secrets.PROXYSQL_ARTIFACTS_TOKEN }}
    with:
      infradb: ${{ vars.MATRIX_3P_SQLALCHEMY_INFRADB_PGSQL }}
      connector: ${{ vars.MATRIX_3P_SQLALCHEMY_CONNECTOR_PGSQL }}
      proxysql_repo: 'sysown/proxysql'
      sha: ${{ inputs.sha }}
      branch: ${{ inputs.branch }}
      build_run_id: ${{ inputs.build_run_id }}
      producer_attempt: ${{ inputs.build_attempt }}
      consumer_id: run-pgsql   # the catalogue instance (row) of this job
