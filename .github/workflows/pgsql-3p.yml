# PostgreSQL 3rd-party tests: run the original test suites of PostgreSQL drivers through ProxySQL and
# directly against PostgreSQL, and compare the results.
#   resolve      the sysown/proxysql commit (branch head, default v3.0, or an explicit full sha);
#                only the sha is passed on, so the tested commit cannot change mid-run
#   build        ProxySQL v4.0 at that commit, packaged once as a Docker image (pgsql-3p-build.yml)
#   environment-check
#                loads exactly that image, then starts, proves and stops the four standard legs
#                (PostgreSQL directly and through ProxySQL, with and without TLS); stage 3 replaces it
#                with the suite jobs, which use the same scripts around their tests
# Independent of the MySQL pipeline (CI-3p.yml, 3p-build.yml, 3p-suite.yml).
name: PostgreSQL 3rd-party tests
run-name: "PostgreSQL 3rd-party tests ${{ inputs.proxysql_ref }}"

on:
  workflow_dispatch:
    inputs:
      proxysql_ref:
        description: 'sysown/proxysql branch, or full 40-hex commit'
        default: 'v3.0'
        type: string

# no concurrency group: runs are independent, so several commits can be tested at the same time
permissions:
  contents: read
  actions: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false

    - name: Resolve the ProxySQL commit
      id: resolve
      env:
        REF: ${{ inputs.proxysql_ref }}
      run: |
        set -euo pipefail
        SHA=$(bash pgsql/lib/resolve-ref.sh "${REF}")
        echo "commit: ${SHA}"
        echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    uses: ./.github/workflows/pgsql-3p-build.yml
    with:
      sha: ${{ needs.resolve.outputs.sha }}

  # stage 2: the test environment of each standard leg comes up and is proven on the build of this run;
  # stage 3 replaces this job with the suite matrix, which uses the same scripts around its tests
  environment-check:
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LEGS: direct-plain direct-tls proxy-plain proxy-tls
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false

    - name: Download the image
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: ${{ needs.build.outputs.image_artifact }}

    - name: Load the image and check it is the build of this run
      id: image
      env:
        SHA: ${{ needs.resolve.outputs.sha }}
        IMAGE_ID: ${{ needs.build.outputs.image_id }}
        IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        BUILD_VERSION: ${{ needs.build.outputs.version }}
      run: |
        set -euo pipefail
        TAG=$(bash pgsql/lib/load-image.sh proxysql-image.tar.zst "${IMAGE_ID}")
        [[ ${TAG} == "${IMAGE_TAG}" ]] || { echo "::error::loaded ${TAG}, expected ${IMAGE_TAG}"; exit 1; }
        VERSION=$(bash pgsql/lib/check-version.sh "${TAG}" "${SHA}")
        [[ ${VERSION} == "${BUILD_VERSION}" ]] || { echo "::error::version ${VERSION}, build reported ${BUILD_VERSION}"; exit 1; }
        rm -f proxysql-image.tar.zst
        echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
        {
          echo "### ProxySQL image"
          echo "- version: \`${VERSION}\`"
          echo "- image ID: \`${IMAGE_ID}\`"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Create the test certificates
      run: bash pgsql/lib/certs.sh "${RUNNER_TEMP}/certs"

    - name: Start, prove and stop each leg
      env:
        PROXYSQL_IMAGE: ${{ steps.image.outputs.tag }}
      run: |
        set -uo pipefail
        export CERT_DIR="${RUNNER_TEMP}/certs"
        for leg in ${LEGS}; do
          echo "::group::${leg}"
          # a failed leg is recorded in its leg.json; the other legs still run. The timeout is a backstop:
          # leg-up's own limits add up to about 4 minutes
          timeout 300 bash pgsql/lib/leg-up.sh "${leg}" "legs/${leg}" || true
          bash pgsql/lib/leg-down.sh "legs/${leg}"
          echo "::endgroup::"
        done

    # always(): the logs matter most when the job was stopped, e.g. by its timeout
    - name: Check the artifacts hold no keys or passwords
      id: guard
      if: ${{ always() }}
      run: |
        set -uo pipefail
        : > "${RUNNER_TEMP}/no-secrets"
        BAD=0
        # every folder the upload below takes, not only the expected legs
        for d in legs/*/artifacts; do
          [[ -d ${d} ]] || continue
          SECRETS="${d%/artifacts}/secrets"
          [[ -f ${SECRETS} ]] || SECRETS="${RUNNER_TEMP}/no-secrets"
          bash pgsql/lib/guard-artifacts.sh "${d}" "${SECRETS}" || BAD=1
        done
        exit "${BAD}"

    - name: Upload the leg artifacts
      if: ${{ always() && steps.guard.outcome == 'success' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: pgsql-3p-environment-${{ needs.resolve.outputs.sha }}-attempt${{ github.run_attempt }}
        path: legs/*/artifacts
        retention-days: 7

    - name: Summary, and fail if a leg is not ready
      if: ${{ always() }}
      run: |
        set -uo pipefail
        echo "### Legs" >> "$GITHUB_STEP_SUMMARY"
        # shellcheck disable=SC2086  # one argument per leg
        bash pgsql/lib/legs-summary.sh legs ${LEGS} >> "$GITHUB_STEP_SUMMARY"
